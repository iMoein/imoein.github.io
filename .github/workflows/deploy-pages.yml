name: Deploy static site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read  # Verify newly uploaded Pages artifact is indexed before deploy

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish website
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Prepare public-only static files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site

          # The studio and private Markdown are deliberately not part of this deployment.
          # Only website entry files and known static directories can enter _site.
          for name in index.html about.html portfolio.html 404.html CNAME favicon.ico site.webmanifest robots.txt sitemap.xml portfolio.json styles.css home.css site-footer.css site-analytics.js app.js home.js home-collaborations.js portfolio.js site-navigation.js site-theme.js site-loader.js site-footer.js; do
            test -f "$name" || { echo "::error::Missing required site file $name"; exit 1; }
            cp "$name" "_site/$name"
          done

          # Search engine verification files are static public website files.
          for name in google*.html; do
            if test -f "$name"; then cp "$name" "_site/$name"; fi
          done

          for directory in assets resume blog; do
            test -d "$directory" || { echo "::error::Missing website directory $directory"; exit 1; }
            mkdir -p "_site/$directory"
            rsync -a --exclude='.DS_Store' --exclude='.*' \
              --exclude='*.py' --exclude='*.md' \
              "$directory/" "_site/$directory/"
          done

          # Defense in depth: publishing must never ship editor code or local previews.
          if find _site -type f \( -name '*.md' -o -name '*.py' -o -name '.DS_Store' \) | grep -q .; then
            echo "::error::Private/source files found in the site artifact."
            exit 1
          fi
          test ! -e _site/scripts
          test ! -e _site/Blog\ Studio.command
          test -f _site/blog/fa/index.html
          test -f _site/blog/en/index.html
          echo "Public files prepared:"
          find _site -type f | wc -l

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload public site artifact
        id: pages_artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      # GitHub's artifact upload and Pages deployment services can briefly
      # disagree about newly finalized artifacts. Confirm this exact upload
      # is visible before asking deploy-pages to resolve it (HTTP 200 but
      # "Found 0 artifact(s)" was observed on immediate deployment).
      - name: Wait for Pages artifact to become visible
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ARTIFACT_ID: ${{ steps.pages_artifact.outputs.artifact_id }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_ARTIFACT_ID" =~ ^[0-9]+$ ]] || {
            echo "::error::No valid uploaded artifact ID was returned."
            exit 1
          }
          for attempt in {1..20}; do
            count="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
              --jq "[.artifacts[] | select(.id == ${EXPECTED_ARTIFACT_ID} and .name == \"github-pages\" and (.expired | not))] | length" \
              2>/dev/null || echo 0)"
            if [[ "$count" == "1" ]]; then
              echo "Uploaded Pages artifact $EXPECTED_ARTIFACT_ID is indexed."
              # Also allow the internal deployment artifact service to catch up.
              sleep 12
              exit 0
            fi
            echo "Waiting for artifact registration (attempt $attempt)."
            sleep 3
          done
          echo "::error::Pages artifact $EXPECTED_ARTIFACT_ID was not indexed."
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
